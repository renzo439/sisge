services:
  mysql:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_DATABASE: sisge
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql, ./database:/docker-entrypoint-initdb.d:ro]
  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sisge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["8080:8080"]
    depends_on: [mysql]
volumes: { mysql-data: {} }
